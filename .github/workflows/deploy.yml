name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fowoco/client:latest
            ghcr.io/fowoco/client:${{ github.sha }}

      - name: Set up kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Checkout infra manifests
        uses: actions/checkout@v4
        with:
          repository: fowoco/infra
          path: infra

      - name: Bootstrap k8s resources
        run: |
          kubectl apply -f infra/k8s/00-namespace.yaml
          kubectl apply -f infra/k8s/04-client.yaml
          kubectl apply -f infra/k8s/05-ingress.yaml

      - name: Rollout
        run: |
          kubectl -n fowoco set image deployment/client \
            client=ghcr.io/fowoco/client:${{ github.sha }} \
            --record=false
          kubectl -n fowoco rollout status deployment/client --timeout=180s
