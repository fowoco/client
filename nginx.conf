# TEMP: 심사용 임시 배포 설정 — 정식 CI/CD·배포 파이프라인 확정 전까지 사용
server {
  listen 80;
  root /usr/share/nginx/html;

  # PDF.js는 ES module Worker를 사용한다. nginx:1.27-alpine 기본 MIME 표에는
  # .mjs가 없어 application/octet-stream으로 내려가므로 브라우저가 실행을 거부한다.
  location ~* \.mjs$ {
    types {
      application/javascript mjs;
    }
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
